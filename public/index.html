<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Watch multiple twitch streams at once.">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">

    <script src='https://embed.twitch.tv/embed/v1.js'></script>
    <link href="https://fonts.googleapis.com/css?family=Material+Icons|Poppins:400,500,600,700&display=swap" rel="stylesheet">
    <title>Streamist - Multiple Twitch Stream Viewer</title>

    <link rel="apple-touch-icon" sizes="180x180" href="<%= BASE_URL %>apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="<%= BASE_URL %>favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="<%= BASE_URL %>favicon-16x16.png">
    <link rel="manifest" href="<%= BASE_URL %>site.webmanifest">
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="streamist"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
